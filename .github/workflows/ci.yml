name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Forms kit tests
        run: python3 -m unittest discover -s tests
        working-directory: forms/generator
      - run: cp wrangler.toml.example wrangler.toml
      - run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry-run-bundle
